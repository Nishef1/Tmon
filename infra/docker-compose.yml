name: tmon

x-backend: &backend
  build:
    context: ../backend
  env_file:
    - ../.env
  environment:
    TMON_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tmon}:${POSTGRES_PASSWORD:-tmon}@postgres:5432/${POSTGRES_DB:-tmon}
    TMON_REDIS_URL: redis://redis:6379/0
    TMON_MINIO_ENDPOINT: minio:9000
    TMON_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-tmon}
    TMON_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-tmon-dev-secret}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tmon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tmon}
      POSTGRES_DB: ${POSTGRES_DB:-tmon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tmon} -d ${POSTGRES_DB:-tmon}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tmon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tmon-dev-secret}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn tmon.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    command: celery -A tmon.tasks.celery_app:app worker --loglevel=INFO -Q tmon
    depends_on:
      backend:
        condition: service_healthy

  beat:
    <<: *backend
    command: celery -A tmon.tasks.celery_app:app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
