[project]
name = "tmon"
version = "0.1.0"
description = "Tmon"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.8",
    "polars>=2.1.0",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "httpx>=0.28.1",
    "playwright>=1.65.2",  # Mofid login in the owner's Chrome
    "minio>=7.2.20",
    "jdatetime>=6.1.1",
    "pyyaml>=6.0.3",
    "jinja2>=3.1.6",
    "tenacity>=9.1",
    "hazm>=0.12.1",
    "anthropic>=2.8.0",
    "iran-bourse-mcp>=0.5.0",
    "arch>=9.0.0",
    "apprise>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "mypy>=2.4.1",
    "types-pyyaml",
    "pandas-stubs",
    "ta-lib>=0.6",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' -ra"
markers = [
    "network: hits live external sites; skipped in CI",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["research"]  # one-off research scripts, not engine code

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "RUF",
    "C4", "PERF", "FURB", "PIE", "PTH", "FLY", "ASYNC", "PLE", "PLW",
    "DTZ011", "PLR0124", "PLR5501", "RET504",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Persian text uses Arabic-script look-alike characters
    "PLW0603",  # module-level flags (schema ready, Codal cool-down) are deliberate
    "PLW2901",  # rebinding a loop variable after cleaning it reads better here
    "ASYNC240",  # CLI backfills write tiny state files; not worth an async file API
]

[tool.ruff.lint.per-file-ignores]
"src/tmon/backtest/report.py" = ["E501"]  # Persian report strings
"src/tmon/backtest/exposure_eval.py" = ["E501"]  # Persian report strings
"src/tmon/backtest/v2_gates.py" = ["E501"]  # Persian report strings
"src/tmon/tools/orderbook_research.py" = ["E501"]  # Persian texts
"src/tmon/backtest/runner.py" = ["E501"]
"tests/**" = ["E501", "PERF401"]  # long synthetic payload lines; explicit loops in fixtures
"src/tmon/devtools/fake_tsetmc.py" = ["PERF401"]  # builds fake CSV rows line by line

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tmon.core.*"
strict = true

[[tool.mypy.overrides]]
module = "tmon.tasks.*"
disallow_untyped_decorators = false
