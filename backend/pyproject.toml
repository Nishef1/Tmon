[project]
name = "tmon"
version = "0.1.0"
description = "Tmon"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "polars>=1.8",
    "numpy>=2.0",
    "pyarrow>=17",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "minio>=7.2",
    "jdatetime>=5.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' -ra"
markers = [
    "network: hits live external sites; skipped in CI",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tmon.core.*"
strict = true

[[tool.mypy.overrides]]
module = "tmon.tasks.*"
disallow_untyped_decorators = false
