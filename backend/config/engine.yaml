# Engine parameters (docs/10-recommendation-engine.md). Nothing here is a market
# rule: fees, taxes, price limits and trading hours live in the `market_rules` table.
# Values marked "provisional" have no number in the docs and must be reviewed.

universe:
  min_median_value_20d: 20000000000   # rial, D1 default per docs/10 section 1
  min_history_days: 120
  exclude_queue_states: [sell_queue]

labeling:
  # Default pair when no grid selection runs. The walk-forward picks from `grid` per window.
  k_tp: 2.0
  k_sl: 1.0
  atr_period: 14
  timeframes:
    D1: { horizon_days: 3, atr_scale_days: 1 }
    W1: { horizon_days: 10, atr_scale_days: 5 }
    M1: { horizon_days: 60, atr_scale_days: 20 }
  # Nested selection (ADR 0002 section 4): every pair is tried inside each training window and
  # the pair with the best mean net return per trade on the inner validation slice wins.
  grid:
    D1: { k_tp: [1.0, 1.5, 2.0], k_sl: [1.0, 1.5] }
    W1: { k_tp: [1.0, 1.5, 2.0], k_sl: [1.0, 1.5] }   # same pattern, own horizon (ADR 0002 section 4)
    M1: { k_tp: [1.0, 1.5, 2.0], k_sl: [1.0, 1.5] }
  # Target per timeframe. relative: y = 1 when the trade's realized return beats the median of
  # the usable trades opened the same day (OPEN_QUESTIONS 67, owner decision 22 Aban 1405); the
  # barrier exits and realized returns stay, so EV is still an absolute expected return.
  target: { D1: relative, W1: barrier, M1: barrier }

# Timeframes the daily cycle trains and publishes. D1 is required; W1 and M1 are optional
# steps (a failure there does not fail the cycle). v1 of W1/M1 uses price and flow features only.
publish_timeframes: [D1, W1, M1]

costs:
  # Round-trip slippage as a fraction of price, split evenly between the buy and sell side:
  # 0.005 = 0.25% per side (ADR 0002 section 2).
  slippage_fraction: 0.005
  # Commission and tax come from market_rules (rules: commission_buy,
  # commission_sell, sell_tax). They are never defaulted in code.

thresholds:
  # ADR 0002 section 3: p_breakeven = (L + c) / (W + L) per probability bucket;
  # p_min = max(p_breakeven + margin, p_floor); EV_net (after costs) >= ev_min_abs.
  margin: 0.05
  p_floor: 0.35
  ev_min_abs: 0.005
  min_bucket_samples: 200
  tiers:
    # offsets above p_breakeven. A also needs the bucket's accuracy over the last
    # `model.recent_days` to reach p_breakeven + recent_bucket_accuracy_margin.
    A: { p_win_margin: 0.12, recent_bucket_accuracy_margin: 0.08 }
    B: { p_win_margin: 0.08 }

sizing:
  kelly_fraction: 0.25
  max_position_pct: 0.10
  risk_per_trade: 0.01
  sector_cap_pct: 0.25
  liquidity_cap_of_median_value: 0.05
  correlation_window_days: 60
  correlation_max: 0.8

baseline_d1:
  min_ind_buy_power: 1.5
  min_rel_volume: 1.5
  rsi_min: 45
  rsi_max: 70

validation:
  retrain_every_days: 20
  min_train_days: 250            # provisional
  embargo_equals_horizon: true
  regimes:
    # Boundaries are Gregorian dates; the halt follows docs/01 (9 Esfand 1404 to
    # 29 Ordibehesht 1405).
    - { name: normal, start: null, end: 2026-02-27 }
    - { name: halt, start: 2026-02-28, end: 2026-05-18 }
    - { name: post_reopen, start: 2026-05-19, end: null }

lightgbm:
  params:
    objective: binary
    learning_rate: 0.03
    num_leaves: 15
    min_data_in_leaf: 200
    feature_fraction: 0.7
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 10.0
    verbose: -1
    seed: 42
    deterministic: true          # same data -> same model file (model_version is a content hash)
    force_row_wise: true
  num_boost_round: 400
  early_stopping_rounds: 40

calibration:
  method: isotonic
  n_buckets: 10

defensive_mode:
  enabled: true
  p_min_bump: 0.05
  breadth_floor: 0.35
  market_net_flow_negative_days: 3

backtest:
  # Provisional (no number in the docs). Portfolio-level limits for the simulator.
  max_new_positions_per_day: 5
  max_gross_exposure: 1.0
  initial_capital: 1000000000        # rial; only scales absolute P&L, not returns

benchmarks:
  # Annual rate of the fixed-income fund / short treasury yield used as the risk-free
  # rate and as a comparison line. No verified value is available offline, so it is left
  # null on purpose: reports then print "not available" and Sharpe uses 0 (docs/OPEN_QUESTIONS.md).
  fixed_income_annual_rate: null
  # Official TSETMC indices used as benchmarks (ADR 0002 section 6). Codes were read from
  # GetIndexB1LastAll on 2026-11-11: "شاخص كل" and "شاخص كل (هم وزن)".
  indices:
    tedpix: "32097828799138957"
    equal_weight: "67130298613737946"
  # Risk-free rate = yield to maturity of the treasury bill (اخزا) whose remaining life is nearest
  # to rf_target_days, from its daily final price (ADR 0002 section 6). Face value 1,000,000 rial:
  # not published by the feed; derived from data (listing-day reference price = 1,000,000 and
  # prices converging to it near maturity), see docs/reports/risk-free-check.md.
  treasury_bill_face_value: 1000000
  rf_target_days: 365
  rf_min_days_to_maturity: 30

model:
  # Provisional (no numbers in the docs). Chronological split of each training window:
  # fit | early stopping | calibration (two halves: isotonic, bucket stats), purged by label window.
  calibration_fraction: 0.20
  early_stopping_fraction: 0.15
  recent_days: 60               # "last 3 months" of docs/10 section 6, in trading days
  min_recent_samples: 30        # fewer recent samples in the bucket => tier A impossible
  tier_a_min_trades: 100        # out-of-sample trades needed before a backtest can unlock tier A
  grid_min_signals: 30          # provisional: smaller samples give a barrier pair no score

# Engine v2 (ADR 0003). Every number comes from the literature, not from our five years of
# data (OPEN_QUESTIONS 85); the only check on them is the robustness gate G5.
v2:
  exposure:
    trend_window_days: 200        # equal-weight index above its simple moving average
    abs_mom_days: 126             # index return over this window must beat the treasury-bill return
    vol_window_days: 20           # realised volatility window of the equal-weight index
    # Annual volatility the equity sleeve is scaled to. null = the vol cap is switched off
    # (factor 1): the owner has not chosen a number (OPEN_QUESTIONS 85). The R2 report prints
    # a sensitivity table instead of picking one.
    target_vol_annual: null
    stress_window_days: 5         # mean share of the universe in a sell queue
    max_exposure: 1.0             # no leverage
    sensitivity_target_vols: [0.15, 0.20, 0.25, 0.30, 0.40]

  # Baseline portfolio (ADR 0003 section 6). Sector, name and liquidity caps are `sizing.*`.
  portfolio:
    n_names: 20                   # ADR: 15 to 20 names, equal weight
    n_tranches: 4                 # weekly review of one tranche = a full review every 4 weeks
    review_every_days: 5
    buy_top_frac: 0.10            # buy from the top decile ...
    hold_top_frac: 0.30           # ... hold until the name leaves the top 30% (the buffer)
    entry_delay_days: 1           # decided at close t, executed at close t+1
    warmup_days: 20               # book still being built: excluded from every statistic
    min_cross_section: 30         # first day with at least this many ranked symbols starts the book

  # Publication gate G1-G6 (ADR 0003 section 7)
  gates:
    min_year_win_share: 0.6       # G1: share of calendar years beating the index
    min_days_per_year: 100        # a calendar year with fewer days is shown but not counted
    max_monthly_one_way_turnover: 0.5
    min_monthly_excess_t: 3.0
    robust_names_delta: 5         # G5: +-5 names
    robust_entry_delay_days: 2    # G5: one day later
    robust_cost_multiplier: 1.5   # G5
    pbo_splits: 8
    survivorship_resolved: false  # G6: OQ 65 is open; flip only with an official source

# Living ranking (docs/ROADMAP-live-and-deep.md): which way of weighting the signals the market
# currently rewards. Candidates are tested on the latest `window_dates` out-of-sample dates and only
# a candidate that beats the fixed equal weights in BOTH halves of that window is promoted.
adapt:
  window_dates: 500             # trailing dates with a known outcome the gate looks at
  min_half_dates: 150           # each half needs this many valid dates, else no promotion
  min_t: 2.0                    # paired t of the IC gain over equal weights
  switch_margin_t: 1.0          # a challenger must beat the sitting champion's t by this much
  history_keep: 240             # cycles kept in the state document
  replay_every_dates: 21        # replay: how often the gate is re-run on the past
  candidates: [ridge4_x60, ridge4_x120, ridge4_x250, icw_x250, hedge_k30, step6, ridgeall_x250, gbm]

